[profile.default]
src = "src"
out = "out"
libs = ["lib"]
# WARNING: Do not run `forge fmt`. It causes the Yul IR optimizer to produce
# pathological bytecode (OOG at runtime). via_ir is required for MarketsFacet
# (stack-too-deep without it).
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200 # change to 1 when deploying
# Glob patterns to skip when building and running tests
# See: https://getfoundry.sh/config/reference/default-config
skip = ["src/legacy/**/*", "test/legacy/**/*", "script/legacy/**/*"]

# Allow scripts to read deployment files
fs_permissions = [
    { access = "read", path = "./deployments" },
    { access = "read", path = "./out" }
]

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "openzeppelin-solidity/=lib/openzeppelin-solidity/",
    "@gnosis.pm/conditional-tokens-contracts/=lib/conditional-tokens-contracts/contracts/",
    "@pythnetwork/pyth-sdk-solidity/=lib/pyth-sdk-solidity/"
]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
